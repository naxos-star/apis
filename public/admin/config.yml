backend:
  name: github
  repo: naxos-star/apis
  branch: main
  # base_url: https://your-oauth-worker.workers.dev  # optional OAuth worker, see README

# Edit local files directly in Chrome/Edge, no GitHub needed.
local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: topics
    label: Topics
    label_singular: Topic
    folder: src/content/topics
    extension: md
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text, hint: One or two sentences shown on the home page. }
      - { name: order, label: Order, widget: number, value_type: int, default: 10, hint: Lower numbers appear first. }
      - { name: image, label: Image, widget: image, required: false }
      - { name: imageAlt, label: Image description, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: home
        label: Home page
        file: src/content/settings/home.json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: tagline, label: Tagline, widget: text }
          - { name: intro, label: Introduction, widget: text }
